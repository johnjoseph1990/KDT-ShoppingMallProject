<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Git 기초 — KDT 쇼핑몰 프로젝트</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --accent: #f78166;
    --accent2: #79c0ff;
    --accent3: #56d364;
    --accent4: #d2a8ff;
    --text: #e6edf3;
    --muted: #8b949e;
    --code-bg: #21262d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* ── 진행 바 ── */
  #progress-bar {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width .4s ease;
    z-index: 100;
  }

  /* ── 슬라이드 컨테이너 ── */
  #deck {
    width: 100vw; height: 100vh;
    position: relative;
  }
  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 60px 80px;
    opacity: 0;
    transform: translateX(60px);
    transition: opacity .45s ease, transform .45s ease;
    pointer-events: none;
  }
  .slide.active {
    opacity: 1;
    transform: translateX(0);
    pointer-events: all;
  }
  .slide.exit {
    opacity: 0;
    transform: translateX(-60px);
  }

  /* ── 슬라이드 번호 ── */
  #counter {
    position: fixed;
    bottom: 20px; right: 28px;
    font-size: 13px;
    color: var(--muted);
    z-index: 100;
  }

  /* ── 네비게이션 버튼 ── */
  .nav-btn {
    position: fixed;
    bottom: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 18px;
    width: 44px; height: 44px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, border-color .2s;
    z-index: 100;
  }
  .nav-btn:hover { background: var(--border); border-color: var(--accent2); }
  #btn-prev { left: calc(50% - 58px); }
  #btn-next { left: calc(50% + 14px); }

  /* ── 타이포그래피 ── */
  .slide-title {
    font-size: 2.6rem;
    font-weight: 700;
    letter-spacing: -.5px;
    margin-bottom: 12px;
    text-align: center;
  }
  .slide-subtitle {
    font-size: 1.1rem;
    color: var(--muted);
    margin-bottom: 40px;
    text-align: center;
  }
  .tag {
    display: inline-block;
    font-size: .75rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    margin-bottom: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ── 카드 그리드 ── */
  .card-grid {
    display: grid;
    gap: 16px;
    width: 100%;
    max-width: 900px;
  }
  .card-grid.cols-2 { grid-template-columns: 1fr 1fr; }
  .card-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 24px;
  }
  .card h3 {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .card p, .card li {
    font-size: .88rem;
    color: var(--muted);
    line-height: 1.7;
  }
  .card ul { padding-left: 16px; }

  /* ── 코드 블록 ── */
  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 22px;
    font-size: .85rem;
    font-family: 'Cascadia Code', 'D2Coding', 'Fira Code', monospace;
    line-height: 1.8;
    overflow-x: auto;
    width: 100%;
    max-width: 820px;
  }
  .c-green  { color: var(--accent3); }
  .c-blue   { color: var(--accent2); }
  .c-red    { color: var(--accent); }
  .c-purple { color: var(--accent4); }
  .c-muted  { color: var(--muted); }
  .c-yellow { color: #e3b341; }

  /* ── 흐름 다이어그램 ── */
  .flow {
    display: flex;
    align-items: center;
    gap: 0;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 860px;
  }
  .flow-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 20px;
    text-align: center;
    min-width: 150px;
  }
  .flow-box .icon { font-size: 1.8rem; margin-bottom: 6px; }
  .flow-box .label { font-size: .78rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px; }
  .flow-box .name { font-size: 1rem; font-weight: 700; }
  .flow-arrow {
    font-size: 1.4rem;
    color: var(--border);
    margin: 0 6px;
  }
  .flow-cmd {
    font-size: .72rem;
    color: var(--accent2);
    font-family: monospace;
    margin-top: 6px;
  }

  /* ── 뱃지 ── */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: .75rem;
    font-weight: 600;
  }
  .badge-green { background: #1a3a22; color: var(--accent3); }
  .badge-blue  { background: #1a2d45; color: var(--accent2); }
  .badge-red   { background: #3a1a1a; color: var(--accent); }
  .badge-purple{ background: #2a1a40; color: var(--accent4); }

  /* ── 테이블 ── */
  table {
    border-collapse: collapse;
    width: 100%;
    max-width: 860px;
    font-size: .88rem;
  }
  th {
    background: var(--surface);
    color: var(--muted);
    font-size: .75rem;
    letter-spacing: .5px;
    text-transform: uppercase;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    text-align: left;
  }
  td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }
  td code, th code {
    background: var(--code-bg);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: monospace;
    font-size: .82rem;
    color: var(--accent2);
  }
  td.muted { color: var(--muted); font-size: .83rem; }

  /* ── 충돌 블록 ── */
  .conflict-block {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    width: 100%;
    max-width: 700px;
    font-family: monospace;
    font-size: .85rem;
  }
  .conflict-mine   { background: #1a2d1a; padding: 12px 18px; border-bottom: 1px solid var(--border); }
  .conflict-sep    { background: var(--code-bg); padding: 8px 18px; color: var(--muted); border-bottom: 1px solid var(--border); }
  .conflict-theirs { background: #1a1a2d; padding: 12px 18px; }

  /* ── 타이틀 슬라이드 전용 ── */
  .hero-icon { font-size: 5rem; margin-bottom: 20px; }
  .hero-title { font-size: 3.2rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 12px; }
  .hero-desc  { font-size: 1rem; color: var(--muted); line-height: 1.7; text-align: center; max-width: 560px; }
  .hero-chips { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }

  /* ── 키보드 힌트 ── */
  #kb-hint {
    position: fixed;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    font-size: .72rem;
    color: #484f58;
    z-index: 100;
  }
</style>
</head>
<body>

<div id="progress-bar"></div>
<div id="deck"></div>

<button class="nav-btn" id="btn-prev" onclick="go(-1)">‹</button>
<button class="nav-btn" id="btn-next" onclick="go(1)">›</button>
<div id="counter"></div>
<div id="kb-hint">← → 키보드로 이동</div>

<script>
const slides = [

/* ══════════════════════════════════════════════
   슬라이드 01 — 타이틀
══════════════════════════════════════════════ */
`<div class="hero-icon">🌿</div>
<div class="hero-title">Git 기초</div>
<div class="hero-desc">KDT 쇼핑몰 프로젝트에서 실제 사용한<br>Git 명령어와 핵심 개념을 정리한 슬라이드</div>
<div class="hero-chips">
  <span class="badge badge-green">Java 17</span>
  <span class="badge badge-blue">Spring Boot</span>
  <span class="badge badge-purple">GitHub</span>
  <span class="badge badge-red">KDT 교육과정</span>
</div>`,

/* ══════════════════════════════════════════════
   슬라이드 02 — Git이란?
══════════════════════════════════════════════ */
`<div class="tag">01 · 개념</div>
<div class="slide-title">Git이란?</div>
<div class="slide-subtitle">코드의 변경 이력을 저장하고 여러 컴퓨터·여러 사람이 함께 작업하게 해주는 버전 관리 도구</div>
<div class="card-grid cols-2" style="max-width:760px">
  <div class="card" style="border-color:#30363d">
    <h3><span>💻</span> 로컬 저장소 (Local)</h3>
    <p>내 컴퓨터 안에 있는 저장소.<br>작업하고 커밋하는 공간.</p>
    <div style="margin-top:12px;font-size:.78rem;font-family:monospace;color:var(--accent3)">C:/KDT-ShoppingMallProject</div>
  </div>
  <div class="card" style="border-color:#30363d">
    <h3><span>☁️</span> 원격 저장소 (Remote)</h3>
    <p>GitHub에 올라간 저장소.<br>공유 · 백업 · 협업의 공간.</p>
    <div style="margin-top:12px;font-size:.78rem;font-family:monospace;color:var(--accent2)">github.com/johnjoseph1990/...</div>
  </div>
</div>
<pre style="max-width:600px;margin-top:24px">
<span class="c-muted"># 내 컴퓨터와 GitHub가 서로 코드를 주고받는 구조</span>

내 컴퓨터 (로컬)     <span class="c-yellow">git push ──▶</span>     GitHub (원격)
                    <span class="c-green">◀── git pull</span>
</pre>`,

/* ══════════════════════════════════════════════
   슬라이드 03 — 4단계 작업 흐름
══════════════════════════════════════════════ */
`<div class="tag">02 · 흐름</div>
<div class="slide-title">코드가 저장되는 4단계</div>
<div class="slide-subtitle">파일을 수정하고 GitHub에 올라가기까지의 여정</div>
<div class="flow" style="margin-bottom:28px">
  <div class="flow-box">
    <div class="icon">📝</div>
    <div class="label">Working</div>
    <div class="name">작업 공간</div>
    <div class="flow-cmd">파일 수정</div>
  </div>
  <div class="flow-arrow">→<br><span style="font-size:.7rem;color:var(--accent2)">git add</span></div>
  <div class="flow-box" style="border-color:var(--accent2)">
    <div class="icon">📦</div>
    <div class="label">Staging</div>
    <div class="name">스테이징</div>
    <div class="flow-cmd">커밋 준비</div>
  </div>
  <div class="flow-arrow">→<br><span style="font-size:.7rem;color:var(--accent3)">git commit</span></div>
  <div class="flow-box" style="border-color:var(--accent3)">
    <div class="icon">🗂️</div>
    <div class="label">Local Repo</div>
    <div class="name">로컬 저장소</div>
    <div class="flow-cmd">스냅샷 기록</div>
  </div>
  <div class="flow-arrow">→<br><span style="font-size:.7rem;color:var(--accent)">git push</span></div>
  <div class="flow-box" style="border-color:var(--accent)">
    <div class="icon">☁️</div>
    <div class="label">Remote</div>
    <div class="name">GitHub</div>
    <div class="flow-cmd">공유 · 백업</div>
  </div>
</div>
<div class="card" style="max-width:760px">
  <p style="font-size:.9rem;line-height:1.9">
    <span class="badge badge-blue">git add</span> "이 파일을 커밋에 포함할게요" 선택 →
    <span class="badge badge-green">git commit</span> 로컬에 저장점 기록 →
    <span class="badge badge-red">git push</span> GitHub에 업로드
  </p>
</div>`,

/* ══════════════════════════════════════════════
   슬라이드 04 — 상태 확인 명령어
══════════════════════════════════════════════ */
`<div class="tag">03 · 명령어</div>
<div class="slide-title">현재 상태 확인</div>
<div class="slide-subtitle">작업 전후 습관처럼 실행하는 필수 명령어 3가지</div>
<div class="card-grid cols-3" style="max-width:900px">
  <div class="card">
    <h3><span class="c-green">$</span> git status</h3>
    <p>수정된 파일 / 스테이징된 파일 / 커밋 안 된 파일 목록 표시</p>
    <p style="margin-top:10px;font-family:monospace;font-size:.78rem;color:var(--accent3)">★ 가장 자주 쓰는 명령어</p>
  </div>
  <div class="card">
    <h3><span class="c-blue">$</span> git log --oneline</h3>
    <p>커밋 이력을 한 줄씩 간결하게 표시</p>
    <p style="margin-top:10px;font-family:monospace;font-size:.78rem;color:var(--accent2)">-10 옵션으로 최근 10개만</p>
  </div>
  <div class="card">
    <h3><span class="c-red">$</span> git diff</h3>
    <p>스테이징 전 변경 내용 줄 단위 비교<br>빨간색 = 삭제, 초록색 = 추가</p>
  </div>
</div>
<pre style="margin-top:20px">
<span class="c-muted"># 실제 git status 출력 예시</span>
On branch <span class="c-green">master</span>
Changes not staged for commit:
  <span class="c-red">modified:   backend/src/.../OrderService.java</span>

Changes to be committed:
  <span class="c-green">new file:   docs/learning/git-basics.md</span>
</pre>`,

/* ══════════════════════════════════════════════
   슬라이드 05 — git pull
══════════════════════════════════════════════ */
`<div class="tag">04 · 명령어</div>
<div class="slide-title">코드 받아오기</div>
<div class="slide-subtitle">다른 PC에서 작업 시작하거나, 팀원 코드를 받을 때</div>
<pre>
<span class="c-muted"># GitHub → 내 컴퓨터로 최신 코드 가져오기</span>
<span class="c-blue">git</span> <span class="c-green">pull</span> <span class="c-yellow">origin</span> <span class="c-purple">master</span>
<span class="c-muted">           ↑       ↑        ↑</span>
<span class="c-muted">        명령어   원격저장소  브랜치이름</span>
</pre>
<div class="card-grid cols-2" style="max-width:760px;margin-top:20px">
  <div class="card" style="border-color:var(--accent2)">
    <h3>💡 pull = fetch + merge</h3>
    <ul>
      <li><code style="color:var(--accent2)">fetch</code> — 원격 변경사항 다운로드</li>
      <li><code style="color:var(--accent3)">merge</code> — 내 브랜치에 합치기</li>
    </ul>
    <p style="margin-top:8px">두 작업을 한 번에 처리</p>
  </div>
  <div class="card" style="border-color:var(--accent)">
    <h3>⚠️ 반드시 먼저 실행!</h3>
    <ul>
      <li>다른 PC에서 작업 시작 시</li>
      <li>팀원 코드가 있을 때</li>
      <li>pull 없이 push하면 충돌 위험</li>
    </ul>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   슬라이드 06 — git add / commit / push
══════════════════════════════════════════════ */
`<div class="tag">05 · 명령어</div>
<div class="slide-title">코드 올리기 3단계</div>
<div class="slide-subtitle">수정한 코드를 GitHub에 올리는 전체 과정</div>
<pre>
<span class="c-muted"># 1단계: 스테이징 — 커밋에 포함할 파일 선택</span>
<span class="c-blue">git add</span> <span class="c-yellow">backend/src/main/java/com/kdt/shoppingmall/service/OrderService.java</span>

<span class="c-muted"># ⚠️  git add .  는 전체 추가 — 민감정보 포함 주의</span>

<span class="c-muted"># 2단계: 커밋 — 로컬에 저장점 기록</span>
<span class="c-blue">git commit</span> -m <span class="c-green">"feat: 주문 취소 API 구현"</span>

<span class="c-muted"># 3단계: 푸시 — GitHub에 업로드</span>
<span class="c-blue">git push</span> <span class="c-yellow">origin</span> <span class="c-purple">master</span>
</pre>
<div class="card" style="max-width:820px;margin-top:16px">
  <p style="font-size:.88rem;line-height:1.8">
    💡 <strong>왜 add를 따로 하나요?</strong><br>
    수정한 파일이 10개여도 그 중 3개만 이번 커밋에 포함할 수 있습니다.<br>
    <code style="color:var(--accent2)">git add</code>로 "이번 커밋에 포함할 파일"을 먼저 골라내는 것입니다.
  </p>
</div>`,

/* ══════════════════════════════════════════════
   슬라이드 07 — git clone
══════════════════════════════════════════════ */
`<div class="tag">06 · 명령어</div>
<div class="slide-title">새 PC에서 시작하기</div>
<div class="slide-subtitle">처음 한 번만 — GitHub 저장소 전체를 내 컴퓨터로 복사</div>
<pre>
<span class="c-muted"># 1. GitHub 저장소 복제 (처음 한 번만)</span>
<span class="c-blue">git clone</span> https://github.com/johnjoseph1990/KDT-ShoppingMallProject.git

<span class="c-muted"># 2. 이미 clone된 PC라면 이후로는 pull만</span>
<span class="c-blue">git pull</span> origin master
</pre>
<div class="card-grid cols-2" style="max-width:760px;margin-top:20px">
  <div class="card">
    <h3>🆕 처음 clone 할 때</h3>
    <ul>
      <li>전체 이력 + 모든 파일 복사</li>
      <li>자동으로 origin 별칭 설정</li>
      <li>새 PC 세팅 시 딱 한 번</li>
    </ul>
  </div>
  <div class="card">
    <h3>🔄 이후 매번</h3>
    <ul>
      <li>작업 시작 전 <code style="color:var(--accent2)">git pull</code></li>
      <li>작업 종료 후 <code style="color:var(--accent3)">git push</code></li>
      <li>clone은 다시 안 해도 됨</li>
    </ul>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   슬라이드 08 — 이 프로젝트 실제 작업 흐름
══════════════════════════════════════════════ */
`<div class="tag">07 · 실전</div>
<div class="slide-title">이 프로젝트의 작업 흐름</div>
<div class="slide-subtitle">매일 반복하는 pull → 수정 → commit → push 사이클</div>

/* ── 렌더링 엔진 ── */
let cur = 0;
const deck   = document.getElementById('deck');
const bar    = document.getElementById('progress-bar');
const counter= document.getElementById('counter');

function render() {
  const total = slides.length;
  bar.style.width = ((cur + 1) / total * 100) + '%';
  counter.textContent = `${cur + 1} / ${total}`;
  document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
  let el = document.getElementById('slide-' + cur);
  if (!el) {
    el = document.createElement('div');
    el.className = 'slide';
    el.id = 'slide-' + cur;
    el.innerHTML = slides[cur];
    deck.appendChild(el);
  }
  requestAnimationFrame(() => el.classList.add('active'));
}

function go(dir) {
  const next = cur + dir;
  if (next < 0 || next >= slides.length) return;
  const old = document.getElementById('slide-' + cur);
  if (old) {
    old.classList.remove('active');
    if (dir > 0) old.classList.add('exit');
    setTimeout(() => old && old.remove(), 450);
  }
  cur = next;
  render();
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') go(1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   go(-1);
});

render();
</script>
