<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spring 테스트 계층 구조 — KDT 쇼핑몰</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --accent: #f78166;
    --accent2: #79c0ff;
    --accent3: #56d364;
    --accent4: #d2a8ff;
    --text: #e6edf3;
    --muted: #8b949e;
    --code-bg: #21262d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* ── 진행 바 ── */
  #progress-bar {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width .4s ease;
    z-index: 100;
  }

  /* ── 슬라이드 컨테이너 ── */
  #deck {
    width: 100vw; height: 100vh;
    position: relative;
  }
  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 60px 80px;
    opacity: 0;
    transform: translateX(60px);
    transition: opacity .45s ease, transform .45s ease;
    pointer-events: none;
  }
  .slide.active {
    opacity: 1;
    transform: translateX(0);
    pointer-events: all;
  }
  .slide.exit {
    opacity: 0;
    transform: translateX(-60px);
  }

  /* ── 슬라이드 번호 ── */
  #counter {
    position: fixed;
    bottom: 20px; right: 28px;
    font-size: 13px;
    color: var(--muted);
    z-index: 100;
  }

  /* ── 네비게이션 버튼 ── */
  .nav-btn {
    position: fixed;
    bottom: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 18px;
    width: 44px; height: 44px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, border-color .2s;
    z-index: 100;
  }
  .nav-btn:hover { background: var(--border); border-color: var(--accent2); }
  #btn-prev { left: calc(50% - 58px); }
  #btn-next { left: calc(50% + 14px); }

  /* ── 타이포그래피 ── */
  .slide-title {
    font-size: 2.6rem;
    font-weight: 700;
    letter-spacing: -.5px;
    margin-bottom: 12px;
    text-align: center;
  }
  .slide-subtitle {
    font-size: 1.1rem;
    color: var(--muted);
    margin-bottom: 40px;
    text-align: center;
  }
  .tag {
    display: inline-block;
    font-size: .75rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    margin-bottom: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ── 카드 그리드 ── */
  .card-grid {
    display: grid;
    gap: 16px;
    width: 100%;
    max-width: 900px;
  }
  .card-grid.cols-2 { grid-template-columns: 1fr 1fr; }
  .card-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 24px;
  }
  .card h3 {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .card p, .card li {
    font-size: .88rem;
    color: var(--muted);
    line-height: 1.7;
  }
  .card ul { padding-left: 16px; }

  /* ── 코드 블록 ── */
  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 22px;
    font-size: .85rem;
    font-family: 'Cascadia Code', 'D2Coding', 'Fira Code', monospace;
    line-height: 1.8;
    overflow-x: auto;
    width: 100%;
    max-width: 820px;
  }
  .c-green  { color: var(--accent3); }
  .c-blue   { color: var(--accent2); }
  .c-red    { color: var(--accent); }
  .c-purple { color: var(--accent4); }
  .c-muted  { color: var(--muted); }
  .c-yellow { color: #e3b341; }

  /* ── 흐름 다이어그램 ── */
  .flow {
    display: flex;
    align-items: center;
    gap: 0;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 860px;
  }
  .flow-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 20px;
    text-align: center;
    min-width: 150px;
  }
  .flow-box .icon { font-size: 1.8rem; margin-bottom: 6px; }
  .flow-box .label { font-size: .78rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px; }
  .flow-box .name { font-size: 1rem; font-weight: 700; }
  .flow-arrow {
    font-size: 1.4rem;
    color: var(--border);
    margin: 0 6px;
  }
  .flow-cmd {
    font-size: .72rem;
    color: var(--accent2);
    font-family: monospace;
    margin-top: 6px;
  }

  /* ── 뱃지 ── */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: .75rem;
    font-weight: 600;
  }
  .badge-green { background: #1a3a22; color: var(--accent3); }
  .badge-blue  { background: #1a2d45; color: var(--accent2); }
  .badge-red   { background: #3a1a1a; color: var(--accent); }
  .badge-purple{ background: #2a1a40; color: var(--accent4); }

  /* ── 테이블 ── */
  table {
    border-collapse: collapse;
    width: 100%;
    max-width: 860px;
    font-size: .88rem;
  }
  th {
    background: var(--surface);
    color: var(--muted);
    font-size: .75rem;
    letter-spacing: .5px;
    text-transform: uppercase;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    text-align: left;
  }
  td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }
  td code, th code {
    background: var(--code-bg);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: monospace;
    font-size: .82rem;
    color: var(--accent2);
  }
  td.muted { color: var(--muted); font-size: .83rem; }

  /* ── 타이틀 슬라이드 전용 ── */
  .hero-icon { font-size: 5rem; margin-bottom: 20px; }
  .hero-title { font-size: 3.2rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 12px; }
  .hero-desc  { font-size: 1rem; color: var(--muted); line-height: 1.7; text-align: center; max-width: 560px; }
  .hero-chips { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }

  /* ── 키보드 힌트 ── */
  #kb-hint {
    position: fixed;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    font-size: .72rem;
    color: #484f58;
    z-index: 100;
  }
</style>
</head>
<body>

<div id="progress-bar"></div>
<div id="deck"></div>

<button class="nav-btn" id="btn-prev" onclick="go(-1)">‹</button>
<button class="nav-btn" id="btn-next" onclick="go(1)">›</button>
<div id="counter"></div>
<div id="kb-hint">← → 키보드로 이동</div>

<script>
const slides = [

/* ══════════════════════════════════════════════
   슬라이드 01 — 타이틀
══════════════════════════════════════════════ */
`<div class="hero-icon">🧪</div>
<div class="hero-title">Spring 테스트 계층 구조</div>
<div class="hero-desc">계층별로 무엇을 어떻게 검증하는가</div>
<div class="hero-chips">
  <span class="badge badge-green">BACKEND</span>
  <span class="badge badge-blue">TESTING</span>
  <span class="badge badge-purple">Spring Boot 3</span>
  <span class="badge badge-red">KDT 교육과정</span>
</div>`,

/* ══════════════════════════════════════════════
   슬라이드 02 — 테스트 3계층 흐름
══════════════════════════════════════════════ */
`<div class="tag">01 · 개념</div>
<div class="slide-title">테스트 3계층 흐름</div>
<div class="slide-subtitle">런타임 흐름과 테스트 흐름을 나란히 비교한다</div>
<div class="card-grid cols-2" style="max-width:900px">
  <div class="card" style="border-color:var(--accent2)">
    <h3><span>🌐</span> 런타임 흐름 (실제 요청)</h3>
    <pre style="background:transparent;border:none;padding:0;font-size:.82rem;line-height:2">
<span class="c-blue">HTTP 요청</span>
   ↓
<span class="c-green">Controller</span>  <span class="c-muted">(입력 검증, 인증)</span>
   ↓
<span class="c-yellow">Service</span>     <span class="c-muted">(비즈니스 로직)</span>
   ↓
<span class="c-purple">Repository</span>  <span class="c-muted">(DB 접근)</span>
   ↓
<span class="c-muted">DB</span></pre>
  </div>
  <div class="card" style="border-color:var(--accent3)">
    <h3><span>🔬</span> 테스트 흐름 (계층별 독립 검증)</h3>
    <pre style="background:transparent;border:none;padding:0;font-size:.82rem;line-height:2.1">
<span class="c-green">@WebMvcTest</span>
   <span class="c-muted">→ Controller만 (Service는 Mock)</span>

<span class="c-yellow">@ExtendWith(MockitoExtension)</span>
   <span class="c-muted">→ Service만 (Repository는 Mock)</span>

<span class="c-purple">@DataJpaTest</span>
   <span class="c-muted">→ Repository만 (실제 H2 DB)</span></pre>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   슬라이드 03 — @WebMvcTest
══════════════════════════════════════════════ */
`<div class="tag">02 · Controller</div>
<div class="slide-title">@WebMvcTest</div>
<div class="slide-subtitle">Spring 전체를 띄우지 않고, 컨트롤러 레이어만 잘라서(slice) 테스트</div>
<pre style="max-width:860px;margin-bottom:20px">
<span class="c-purple">@WebMvcTest</span>(MemberController.<span class="c-blue">class</span>)
<span class="c-purple">@Import</span>({SecurityConfig.<span class="c-blue">class</span>, GlobalExceptionHandler.<span class="c-blue">class</span>})
<span class="c-blue">class</span> <span class="c-green">MemberControllerTest</span> {

    <span class="c-purple">@Autowired</span>
    <span class="c-blue">private</span> MockMvc mockMvc;           <span class="c-muted">// 가짜 HTTP 요청을 보내는 도구</span>

    <span class="c-purple">@MockitoBean</span>
    <span class="c-blue">private</span> MemberService memberService; <span class="c-muted">// Service는 가짜(Mock)로 교체</span>
}</pre>
<div class="card-grid cols-3" style="max-width:860px">
  <div class="card" style="border-color:var(--accent2)">
    <h3>✅ 상태코드 검증</h3>
    <p>200 OK, 401 Unauthorized,<br>404 Not Found 등<br>API 계약 검증</p>
  </div>
  <div class="card" style="border-color:var(--accent3)">
    <h3>🔐 인증/인가 규칙</h3>
    <p>미로그인 시 401,<br>권한 없을 때 403<br>Spring Security 동작 확인</p>
  </div>
  <div class="card" style="border-color:var(--accent4)">
    <h3>📋 Bean Validation</h3>
    <p>@Valid 입력값 검증 결과,<br>잘못된 요청 시<br>400 응답 여부 확인</p>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   슬라이드 04 — @ExtendWith(MockitoExtension)
══════════════════════════════════════════════ */
`<div class="tag">03 · Service</div>
<div class="slide-title">@ExtendWith(MockitoExtension.class)</div>
<div class="slide-subtitle">JUnit5에게 Mockito를 사용하겠다고 알려주는 설정 — DB 없이 서비스 로직만 빠르게 검증</div>
<pre style="max-width:860px;margin-bottom:20px">
<span class="c-purple">@ExtendWith</span>(MockitoExtension.<span class="c-blue">class</span>)
<span class="c-blue">class</span> <span class="c-green">MemberServiceTest</span> {

    <span class="c-purple">@Mock</span>
    <span class="c-blue">private</span> MemberRepository memberRepository; <span class="c-muted">// 가짜 Repository</span>

    <span class="c-purple">@Mock</span>
    <span class="c-blue">private</span> PasswordEncoder passwordEncoder;    <span class="c-muted">// 가짜 암호화 도구</span>

    <span class="c-purple">@InjectMocks</span>
    <span class="c-blue">private</span> MemberService memberService;        <span class="c-muted">// 위 가짜들이 주입된 진짜 Service</span>
}</pre>
<div class="card-grid cols-2" style="max-width:860px">
  <div class="card" style="border-color:var(--accent3)">
    <h3>@Mock — 스프링 컨텍스트 밖</h3>
    <p><code style="color:var(--accent2)">@ExtendWith(MockitoExtension)</code> 환경에서 사용.<br>순수 Mockito 가짜 객체. 빠르고 가볍다.</p>
  </div>
  <div class="card" style="border-color:var(--accent2)">
    <h3>@MockitoBean — 스프링 컨텍스트 안</h3>
    <p><code style="color:var(--accent2)">@WebMvcTest</code> 환경에서 사용.<br>Spring 빈으로 등록되어 컨텍스트에 주입됨.</p>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   슬라이드 05 — given().willReturn()
══════════════════════════════════════════════ */
`<div class="tag">04 · Mock 설정</div>
<div class="slide-title">given().willReturn()</div>
<div class="slide-subtitle">"이 메서드가 호출되면, 이 값을 돌려줘"라고 약속시키는 BDD 스타일 Mock 설정</div>
<pre style="max-width:860px">
<span class="c-muted">// "findById(1L)을 호출하면 member 객체를 돌려줘"</span>
<span class="c-green">given</span>(memberRepository.findById(<span class="c-yellow">1L</span>))
    .willReturn(Optional.of(member));

<span class="c-muted">// "matches("wrongPass", ...)를 호출하면 false를 돌려줘"</span>
<span class="c-green">given</span>(passwordEncoder.matches(<span class="c-red">"wrongPass"</span>, <span class="c-red">"encoded"</span>))
    .willReturn(<span class="c-blue">false</span>);</pre>
<div class="card-grid cols-2" style="max-width:860px;margin-top:20px">
  <div class="card" style="border-color:var(--accent3)">
    <h3>given().willReturn() — BDD 스타일</h3>
    <p>Mockito BDD API. 영어 문장처럼 읽힌다.<br>"given 조건이면 willReturn 이 값을 반환"<br>→ 가독성 우수, 권장 방식</p>
  </div>
  <div class="card" style="border-color:var(--border)">
    <h3>when().thenReturn() — 기존 스타일</h3>
    <p>전통적인 Mockito API.<br>"when 이 호출되면 thenReturn 이 값을"<br>→ 동작은 동일, 표현 방식만 다름</p>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   슬라이드 06 — assertThatThrownBy
══════════════════════════════════════════════ */
`<div class="tag">05 · 예외 검증</div>
<div class="slide-title">assertThatThrownBy</div>
<div class="slide-subtitle">"이 코드를 실행했을 때 예외가 발생하는지, 어떤 예외인지" — AssertJ 예외 검증 API</div>
<pre style="max-width:860px">
<span class="c-muted">// 존재하지 않는 회원 ID로 수정 요청 → 예외 발생 검증</span>
<span class="c-green">assertThatThrownBy</span>(() -> memberService.update(<span class="c-yellow">99L</span>, request))
    .isInstanceOf(ResourceNotFoundException.<span class="c-blue">class</span>)   <span class="c-muted">// 예외 타입 확인</span>
    .hasMessageContaining(<span class="c-red">"존재하지 않는"</span>);           <span class="c-muted">// 메시지 포함 여부 확인</span>
</pre>
<div class="card-grid cols-2" style="max-width:860px;margin-top:20px">
  <div class="card" style="border-color:var(--accent3)">
    <h3>체이닝으로 두 가지 동시 검증</h3>
    <ul>
      <li><code style="color:var(--accent2)">.isInstanceOf()</code> — 예외 클래스 타입이 맞는가</li>
      <li><code style="color:var(--accent2)">.hasMessageContaining()</code> — 메시지에 키워드가 있는가</li>
    </ul>
  </div>
  <div class="card" style="border-color:var(--accent2)">
    <h3>왜 쓰는가?</h3>
    <p>방어 로직(잘못된 비밀번호, 없는 회원 등)이<br>올바르게 동작하는지 보장.<br>JUnit의 <code style="color:var(--accent2)">assertThrows</code>보다 읽기 쉽다.</p>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   슬라이드 07 — willThrow()
══════════════════════════════════════════════ */
`<div class="tag">06 · 예외 Mock</div>
<div class="slide-title">willThrow()</div>
<div class="slide-subtitle">Service 예외 → Controller가 올바른 HTTP 상태코드로 변환하는지 검증</div>
<pre style="max-width:860px">
<span class="c-muted">// Service가 예외를 던졌을 때 Controller가 404로 응답하는지 확인</span>
<span class="c-green">willThrow</span>(<span class="c-blue">new</span> ResourceNotFoundException(<span class="c-red">"존재하지 않는 회원"</span>))
    .given(memberService).update(eq(<span class="c-yellow">1L</span>), any());

mockMvc.perform(put(<span class="c-red">"/api/members/me"</span>)
        .contentType(MediaType.APPLICATION_JSON)
        .content(body)
        .with(jwt()))
    .andExpect(status().isNotFound());   <span class="c-muted">// 404 확인</span>
</pre>
<div class="card" style="max-width:860px;margin-top:20px">
  <p style="font-size:.9rem;line-height:1.9">
    💡 <strong>흐름 요약:</strong>
    <span class="badge badge-red">willThrow</span> → Service Mock이 예외 발생 →
    <span class="badge badge-blue">GlobalExceptionHandler</span> 가 예외를 받아 HTTP 404로 변환 →
    <span class="badge badge-green">status().isNotFound()</span> 로 검증
  </p>
</div>`,

/* ══════════════════════════════════════════════
   슬라이드 08 — 전략 패턴 + 결정론적 테스트
══════════════════════════════════════════════ */
`<div class="tag">07 · 설계</div>
<div class="slide-title">전략 패턴 + 결정론적 테스트</div>
<div class="slide-subtitle">랜덤 요소를 인터페이스로 분리하면 Mock으로 결과를 고정할 수 있다</div>
<div class="card-grid cols-2" style="max-width:900px">
  <div class="card" style="border-color:var(--accent)">
    <h3>❌ 비결정론적 — @RepeatedTest의 한계</h3>
    <pre style="background:transparent;border:none;padding:6px 0;font-size:.78rem;line-height:1.8">
<span class="c-muted">// 90% 성공 / 10% 실패 → 5번 반복해도</span>
<span class="c-muted">// 실패 케이스가 안 나올 수 있음</span>
<span class="c-purple">@RepeatedTest</span>(<span class="c-yellow">5</span>)

/* ── 렌더링 엔진 ── */
let cur = 0;
const deck   = document.getElementById('deck');
const bar    = document.getElementById('progress-bar');
const counter= document.getElementById('counter');

function render() {
  const total = slides.length;
  bar.style.width = ((cur + 1) / total * 100) + '%';
  counter.textContent = `${cur + 1} / ${total}`;
  document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
  let el = document.getElementById('slide-' + cur);
  if (!el) {
    el = document.createElement('div');
    el.className = 'slide';
    el.id = 'slide-' + cur;
    el.innerHTML = slides[cur];
    deck.appendChild(el);
  }
  requestAnimationFrame(() => el.classList.add('active'));
}

function go(dir) {
  const next = cur + dir;
  if (next < 0 || next >= slides.length) return;
  const old = document.getElementById('slide-' + cur);
  if (old) {
    old.classList.remove('active');
    if (dir > 0) old.classList.add('exit');
    setTimeout(() => old && old.remove(), 450);
  }
  cur = next;
  render();
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') go(1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   go(-1);
});

render();
</script>
