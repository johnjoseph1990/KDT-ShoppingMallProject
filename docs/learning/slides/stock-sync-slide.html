<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>재고 동기화 설계 — KDT 쇼핑몰</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --accent: #f78166;
    --accent2: #79c0ff;
    --accent3: #56d364;
    --accent4: #d2a8ff;
    --text: #e6edf3;
    --muted: #8b949e;
    --code-bg: #21262d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* ── 진행 바 ── */
  #progress-bar {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width .4s ease;
    z-index: 100;
  }

  /* ── 슬라이드 컨테이너 ── */
  #deck {
    width: 100vw; height: 100vh;
    position: relative;
  }
  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 60px 80px;
    opacity: 0;
    transform: translateX(60px);
    transition: opacity .45s ease, transform .45s ease;
    pointer-events: none;
  }
  .slide.active {
    opacity: 1;
    transform: translateX(0);
    pointer-events: all;
  }
  .slide.exit {
    opacity: 0;
    transform: translateX(-60px);
  }

  /* ── 슬라이드 번호 ── */
  #counter {
    position: fixed;
    bottom: 20px; right: 28px;
    font-size: 13px;
    color: var(--muted);
    z-index: 100;
  }

  /* ── 네비게이션 버튼 ── */
  .nav-btn {
    position: fixed;
    bottom: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 18px;
    width: 44px; height: 44px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, border-color .2s;
    z-index: 100;
  }
  .nav-btn:hover { background: var(--border); border-color: var(--accent2); }
  #btn-prev { left: calc(50% - 58px); }
  #btn-next { left: calc(50% + 14px); }

  /* ── 타이포그래피 ── */
  .slide-title {
    font-size: 2.6rem;
    font-weight: 700;
    letter-spacing: -.5px;
    margin-bottom: 12px;
    text-align: center;
  }
  .slide-subtitle {
    font-size: 1.1rem;
    color: var(--muted);
    margin-bottom: 40px;
    text-align: center;
  }
  .tag {
    display: inline-block;
    font-size: .75rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    margin-bottom: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ── 카드 그리드 ── */
  .card-grid {
    display: grid;
    gap: 16px;
    width: 100%;
    max-width: 900px;
  }
  .card-grid.cols-2 { grid-template-columns: 1fr 1fr; }
  .card-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 24px;
  }
  .card h3 {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .card p, .card li {
    font-size: .88rem;
    color: var(--muted);
    line-height: 1.7;
  }
  .card ul { padding-left: 16px; }

  /* ── 코드 블록 ── */
  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 22px;
    font-size: .85rem;
    font-family: 'Cascadia Code', 'D2Coding', 'Fira Code', monospace;
    line-height: 1.8;
    overflow-x: auto;
    width: 100%;
    max-width: 820px;
  }
  .c-green  { color: var(--accent3); }
  .c-blue   { color: var(--accent2); }
  .c-red    { color: var(--accent); }
  .c-purple { color: var(--accent4); }
  .c-muted  { color: var(--muted); }
  .c-yellow { color: #e3b341; }

  /* ── 흐름 다이어그램 ── */
  .flow {
    display: flex;
    align-items: center;
    gap: 0;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 860px;
  }
  .flow-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 20px;
    text-align: center;
    min-width: 150px;
  }
  .flow-box .icon { font-size: 1.8rem; margin-bottom: 6px; }
  .flow-box .label { font-size: .78rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px; }
  .flow-box .name { font-size: 1rem; font-weight: 700; }
  .flow-arrow {
    font-size: 1.4rem;
    color: var(--border);
    margin: 0 6px;
  }
  .flow-cmd {
    font-size: .72rem;
    color: var(--accent2);
    font-family: monospace;
    margin-top: 6px;
  }

  /* ── 뱃지 ── */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: .75rem;
    font-weight: 600;
  }
  .badge-green { background: #1a3a22; color: var(--accent3); }
  .badge-blue  { background: #1a2d45; color: var(--accent2); }
  .badge-red   { background: #3a1a1a; color: var(--accent); }
  .badge-purple{ background: #2a1a40; color: var(--accent4); }

  /* ── 테이블 ── */
  table {
    border-collapse: collapse;
    width: 100%;
    max-width: 860px;
    font-size: .88rem;
  }
  th {
    background: var(--surface);
    color: var(--muted);
    font-size: .75rem;
    letter-spacing: .5px;
    text-transform: uppercase;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    text-align: left;
  }
  td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }
  td code, th code {
    background: var(--code-bg);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: monospace;
    font-size: .82rem;
    color: var(--accent2);
  }
  td.muted { color: var(--muted); font-size: .83rem; }

  /* ── 타이틀 슬라이드 전용 ── */
  .hero-icon { font-size: 5rem; margin-bottom: 20px; }
  .hero-title { font-size: 3.2rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 12px; }
  .hero-desc  { font-size: 1rem; color: var(--muted); line-height: 1.7; text-align: center; max-width: 560px; }
  .hero-chips { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }

  /* ── 키보드 힌트 ── */
  #kb-hint {
    position: fixed;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    font-size: .72rem;
    color: #484f58;
    z-index: 100;
  }

  /* ── 시나리오 스텝 ── */
  .step-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 820px;
  }
  .step-item {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 20px;
  }
  .step-num {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent2);
    min-width: 28px;
    margin-top: 2px;
  }
  .step-text {
    font-size: .9rem;
    line-height: 1.6;
    color: var(--text);
  }
  .step-text .sub {
    font-size: .8rem;
    color: var(--muted);
    margin-top: 4px;
  }

  /* ── 번호 목록 ── */
  .check-list {
    width: 100%;
    max-width: 820px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .check-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 22px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .check-num {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--accent4);
    min-width: 24px;
  }
  .check-text {
    font-size: .9rem;
    line-height: 1.6;
    color: var(--text);
  }
</style>
</head>
<body>

<div id="progress-bar"></div>
<div id="deck"></div>

<button class="nav-btn" id="btn-prev" onclick="go(-1)">‹</button>
<button class="nav-btn" id="btn-next" onclick="go(1)">›</button>
<div id="counter"></div>
<div id="kb-hint">← → 키보드로 이동</div>

<script>
const slides = [

/* ══════════════════════════════════════════════
   슬라이드 01 — 타이틀
══════════════════════════════════════════════ */
`<div class="hero-icon">📦</div>
<div class="hero-title">재고 동기화 설계</div>
<div class="hero-desc">동시 주문 상황에서도 정확한 재고 처리가 가능하도록<br>낙관적 락과 복구 경로를 설계한 방법을 정리한 슬라이드</div>
<div class="hero-chips">
  <span class="badge badge-blue">BACKEND</span>
  <span class="badge badge-red">CONCURRENCY</span>
  <span class="badge badge-green">JPA @Version</span>
  <span class="badge badge-purple">KDT 쇼핑몰</span>
</div>`,

/* ══════════════════════════════════════════════
   슬라이드 02 — 재고 변동 경로 전체 그림
══════════════════════════════════════════════ */
`<div class="tag">01 · 전체 구조</div>
<div class="slide-title">재고 변동 경로 전체 그림</div>
<div class="slide-subtitle">차감 1경로 · 복구 2경로 · 동시성 충돌 처리</div>
<div class="card-grid cols-2" style="max-width:860px;margin-bottom:16px">
  <div class="card" style="border-color:var(--accent)">
    <h3><span>📉</span> 재고 차감 경로</h3>
    <p style="font-family:monospace;font-size:.85rem;color:var(--accent3)">
      주문 생성(createOrder)<br>
      → product.decreaseStock(quantity)
    </p>
  </div>
  <div class="card" style="border-color:var(--accent3)">
    <h3><span>📈</span> 재고 복구 경로 (2가지)</h3>
    <p style="font-family:monospace;font-size:.83rem;color:var(--accent2)">
      ① 결제 실패(pay() 실패 분기)<br>
      &nbsp;&nbsp;→ restoreStock()<br><br>
      ② 관리자 취소(changeOrderStatus(CANCELED))<br>
      &nbsp;&nbsp;→ restoreStock()
    </p>
  </div>
</div>
<div class="card" style="max-width:860px;border-color:var(--accent4)">
  <h3><span>⚡</span> 동시성 충돌 경로</h3>
  <p style="font-size:.88rem;line-height:1.8">
    두 사용자가 같은 상품을 동시에 주문
    → JPA <code style="color:var(--accent4)">@Version</code> 버전 불일치 감지
    → <code style="color:var(--accent)">ObjectOptimisticLockingFailureException</code>
    → GlobalExceptionHandler → <span class="badge badge-red">HTTP 409</span> (재시도 메시지)
  </p>
</div>`,

/* ══════════════════════════════════════════════
   슬라이드 03 — @Version 낙관적 락 개념
══════════════════════════════════════════════ */
`<div class="tag">02 · 핵심 개념</div>
<div class="slide-title">@Version — 낙관적 락</div>
<div class="slide-subtitle">"먼저 저장한 사람만 성공" — 나중에 오는 쪽에게는 충돌을 알려준다</div>
<div class="card" style="max-width:820px;margin-bottom:20px;border-color:var(--accent2)">
  <h3>💡 초보자 설명</h3>
  <p>두 사람이 동시에 같은 상품을 수정하려 할 때,<br>
  <strong>먼저 저장한 사람만 성공</strong>하고 뒤에 저장하려는 사람에게
  "이미 바뀐 데이터입니다"라고 알려주는 메커니즘</p>
</div>
<pre>
<span class="c-muted">// Product.java — @Version 필드 선언</span>
<span class="c-purple">@Version</span>
<span class="c-blue">private</span> Long version;

<span class="c-muted">// JPA가 자동으로 생성하는 UPDATE SQL</span>
<span class="c-muted">// UPDATE product</span>
<span class="c-muted">//   SET stock_quantity = ?, version = version + 1</span>
<span class="c-muted">//   WHERE id = ? AND version = ?</span>
<span class="c-muted">//                   ↑ 이 version 조건이 동시성을 막는다</span>
<span class="c-muted">// 업데이트된 행이 0개이면 → 버전 충돌 예외 발생</span>
</pre>`,

/* ══════════════════════════════════════════════
   슬라이드 04 — 낙관적 락 동작 시나리오
══════════════════════════════════════════════ */
`<div class="tag">03 · 시나리오</div>
<div class="slide-title">낙관적 락 동작 시나리오</div>
<div class="slide-subtitle">사용자 A와 B가 동시에 같은 상품을 주문하는 4단계</div>
<div class="step-list">
  <div class="step-item">
    <div class="step-num">1</div>
    <div class="step-text">
      사용자 A, B가 거의 동시에 상품 조회 → 둘 다 <span class="c-blue" style="font-family:monospace">version = 0</span> 상태를 읽음
    </div>
  </div>
  <div class="step-item" style="border-color:var(--accent3)">
    <div class="step-num" style="color:var(--accent3)">2</div>
    <div class="step-text">
      사용자 <strong>B가 먼저</strong> 결제 완료
      <div class="sub">DB: version 0 → 1, 재고 10 → 7</div>
    </div>
  </div>
  <div class="step-item" style="border-color:var(--accent)">
    <div class="step-num" style="color:var(--accent)">3</div>
    <div class="step-text">
      사용자 A가 뒤늦게 결제 시도 → JPA: <span class="c-red" style="font-family:monospace">UPDATE ... WHERE version = 0</span>
      <div class="sub">DB에 version = 0인 행이 없음 (이미 1로 바뀜) → 업데이트 행 수 = 0</div>
    </div>
  </div>
  <div class="step-item" style="border-color:var(--accent4)">
    <div class="step-num" style="color:var(--accent4)">4</div>
    <div class="step-text">
      <span class="c-purple" style="font-family:monospace">ObjectOptimisticLockingFailureException</span> 발생
      <div class="sub">GlobalExceptionHandler → HTTP 409 "다른 주문과 재고 처리가 충돌했습니다. 다시 시도해주세요."</div>
    </div>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   슬라이드 05 — 낙관적 락 vs 비관적 락
══════════════════════════════════════════════ */
`<div class="tag">04 · 비교</div>
<div class="slide-title">낙관적 락 vs 비관적 락</div>
<div class="slide-subtitle">쇼핑몰에서 낙관적 락을 선택한 이유</div>
<table style="max-width:900px;margin-bottom:16px">
  <tr>
    <th>구분</th>
    <th>낙관적 락 <span class="badge badge-green" style="font-size:.7rem">이 프로젝트</span></th>
    <th>비관적 락</th>
  </tr>
  <tr>
    <td><strong>방식</strong></td>
    <td class="muted">저장 시점에 버전 비교</td>
    <td class="muted">조회 시점에 DB 행을 잠금</td>
  </tr>
  <tr>
    <td><strong>SQL</strong></td>
    <td><code>WHERE version = ?</code> 조건</td>
    <td><code>SELECT ... FOR UPDATE</code></td>
  </tr>
  <tr>
    <td><strong>충돌 처리</strong></td>
    <td class="muted">예외 → 클라이언트에 재시도 유도</td>
    <td class="muted">잠금 해제까지 대기</td>
  </tr>
  <tr>
    <td><strong>적합한 상황</strong></td>
    <td class="muted">충돌 빈도가 낮을 때 (일반 쇼핑몰)</td>
    <td class="muted">충돌이 잦거나 대기가 허용될 때</td>
  </tr>
  <tr>
    <td><strong>단점</strong></td>
    <td class="muted">충돌이 잦으면 사용자가 계속 재시도해야 함</td>
    <td class="muted">대기 중 다른 요청이 모두 블로킹됨</td>
  </tr>
</table>
<div class="card" style="max-width:900px;border-color:var(--accent2)">
  <p style="font-size:.88rem">
    💡 <strong>쇼핑몰 선택 이유</strong>: "대부분의 주문은 재고가 충분해서 충돌이 드물다"는 전제에서는
    행을 잠그지 않는 낙관적 락이 처리량(throughput)에 유리하다.
  </p>
</div>`,

/* ══════════════════════════════════════════════
   슬라이드 06 — 재고 차감 decreaseStock()
══════════════════════════════════════════════ */
`<div class="tag">05 · 도메인 로직</div>
<div class="slide-title">재고 차감 — decreaseStock()</div>
<div class="slide-subtitle">도메인 로직을 엔티티 안에 두는 이유</div>
<pre>
<span class="c-muted">// Product.java — 엔티티 안에 재고 차감 로직을 직접 담는다</span>
<span class="c-blue">public void</span> <span class="c-green">decreaseStock</span>(<span class="c-blue">int</span> quantity) {
    <span class="c-muted">// 재고 부족 검사: 서비스가 직접 체크하지 않고 엔티티가 책임진다</span>
    <span class="c-blue">if</span> (<span class="c-blue">this</span>.stockQuantity < quantity) {
        <span class="c-blue">throw new</span> <span class="c-red">InsufficientStockException</span>(
            <span class="c-green">"재고가 부족합니다. 상품: "</span> + <span class="c-blue">this</span>.name
            + <span class="c-green">", 재고: "</span> + <span class="c-blue">this</span>.stockQuantity);
    }
    <span class="c-blue">this</span>.stockQuantity -= quantity; <span class="c-muted">// 차감</span>
}
</pre>
<div class="card" style="max-width:820px;margin-top:16px;border-color:var(--accent3)">
  <h3>왜 엔티티 안에 두는가?</h3>
  <p>서비스가 <code style="color:var(--accent2)">if (product.getStock() &lt; qty)</code> 를 직접 체크하면
  그 로직이 여러 서비스에 흩어질 수 있다.<br>
  엔티티 안에 있으면 "재고 차감은 항상 이 규칙을 지킨다"는 걸 구조가 강제한다.<br>
  이를 <strong>도메인 로직을 엔티티에 둔다</strong>고 표현한다.</p>
</div>`,

/* ══════════════════════════════════════════════
   슬라이드 07 — 재고 복구 restoreStock()
══════════════════════════════════════════════ */
`<div class="tag">06 · 복구 로직</div>

    userA.decreaseStock(<span class="c-yellow">5</span>);
    assertThatThrownBy(() -> productRepository.saveAndFlush(userA))
        .isInstanceOf(<span class="c-red">ObjectOptimisticLockingFailureException</span>.class);

    assertThat(productRepository.findById(productId).orElseThrow().getStockQuantity())

/* ── 렌더링 엔진 ── */
let cur = 0;
const deck   = document.getElementById('deck');
const bar    = document.getElementById('progress-bar');
const counter= document.getElementById('counter');

function render() {
  const total = slides.length;
  bar.style.width = ((cur + 1) / total * 100) + '%';
  counter.textContent = `${cur + 1} / ${total}`;
  document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
  let el = document.getElementById('slide-' + cur);
  if (!el) {
    el = document.createElement('div');
    el.className = 'slide';
    el.id = 'slide-' + cur;
    el.innerHTML = slides[cur];
    deck.appendChild(el);
  }
  requestAnimationFrame(() => el.classList.add('active'));
}

function go(dir) {
  const next = cur + dir;
  if (next < 0 || next >= slides.length) return;
  const old = document.getElementById('slide-' + cur);
  if (old) {
    old.classList.remove('active');
    if (dir > 0) old.classList.add('exit');
    setTimeout(() => old && old.remove(), 450);
  }
  cur = next;
  render();
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') go(1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   go(-1);
});

render();
</script>
