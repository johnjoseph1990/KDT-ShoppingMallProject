<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>프론트엔드 마이페이지 — KDT 쇼핑몰</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --accent: #f78166;
    --accent2: #79c0ff;
    --accent3: #56d364;
    --accent4: #d2a8ff;
    --text: #e6edf3;
    --muted: #8b949e;
    --code-bg: #21262d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* ── 진행 바 ── */
  #progress-bar {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width .4s ease;
    z-index: 100;
  }

  /* ── 슬라이드 컨테이너 ── */
  #deck {
    width: 100vw; height: 100vh;
    position: relative;
  }
  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 60px 80px;
    opacity: 0;
    transform: translateX(60px);
    transition: opacity .45s ease, transform .45s ease;
    pointer-events: none;
  }
  .slide.active {
    opacity: 1;
    transform: translateX(0);
    pointer-events: all;
  }
  .slide.exit {
    opacity: 0;
    transform: translateX(-60px);
  }

  /* ── 슬라이드 번호 ── */
  #counter {
    position: fixed;
    bottom: 20px; right: 28px;
    font-size: 13px;
    color: var(--muted);
    z-index: 100;
  }

  /* ── 네비게이션 버튼 ── */
  .nav-btn {
    position: fixed;
    bottom: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 18px;
    width: 44px; height: 44px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, border-color .2s;
    z-index: 100;
  }
  .nav-btn:hover { background: var(--border); border-color: var(--accent2); }
  #btn-prev { left: calc(50% - 58px); }
  #btn-next { left: calc(50% + 14px); }

  /* ── 타이포그래피 ── */
  .slide-title {
    font-size: 2.6rem;
    font-weight: 700;
    letter-spacing: -.5px;
    margin-bottom: 12px;
    text-align: center;
  }
  .slide-subtitle {
    font-size: 1.1rem;
    color: var(--muted);
    margin-bottom: 40px;
    text-align: center;
  }
  .tag {
    display: inline-block;
    font-size: .75rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    margin-bottom: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ── 카드 그리드 ── */
  .card-grid {
    display: grid;
    gap: 16px;
    width: 100%;
    max-width: 900px;
  }
  .card-grid.cols-2 { grid-template-columns: 1fr 1fr; }
  .card-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 24px;
  }
  .card h3 {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .card p, .card li {
    font-size: .88rem;
    color: var(--muted);
    line-height: 1.7;
  }
  .card ul { padding-left: 16px; }

  /* ── 코드 블록 ── */
  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 22px;
    font-size: .85rem;
    font-family: 'Cascadia Code', 'D2Coding', 'Fira Code', monospace;
    line-height: 1.8;
    overflow-x: auto;
    width: 100%;
    max-width: 820px;
  }
  .c-green  { color: var(--accent3); }
  .c-blue   { color: var(--accent2); }
  .c-red    { color: var(--accent); }
  .c-purple { color: var(--accent4); }
  .c-muted  { color: var(--muted); }
  .c-yellow { color: #e3b341; }

  /* ── 흐름 다이어그램 ── */
  .flow {
    display: flex;
    align-items: center;
    gap: 0;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 860px;
  }
  .flow-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 20px;
    text-align: center;
    min-width: 150px;
  }
  .flow-box .icon { font-size: 1.8rem; margin-bottom: 6px; }
  .flow-box .label { font-size: .78rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px; }
  .flow-box .name { font-size: 1rem; font-weight: 700; }
  .flow-arrow {
    font-size: 1.4rem;
    color: var(--border);
    margin: 0 6px;
  }
  .flow-cmd {
    font-size: .72rem;
    color: var(--accent2);
    font-family: monospace;
    margin-top: 6px;
  }

  /* ── 뱃지 ── */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: .75rem;
    font-weight: 600;
  }
  .badge-green { background: #1a3a22; color: var(--accent3); }
  .badge-blue  { background: #1a2d45; color: var(--accent2); }
  .badge-red   { background: #3a1a1a; color: var(--accent); }
  .badge-purple{ background: #2a1a40; color: var(--accent4); }

  /* ── 테이블 ── */
  table {
    border-collapse: collapse;
    width: 100%;
    max-width: 860px;
    font-size: .88rem;
  }
  th {
    background: var(--surface);
    color: var(--muted);
    font-size: .75rem;
    letter-spacing: .5px;
    text-transform: uppercase;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    text-align: left;
  }
  td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }
  td code, th code {
    background: var(--code-bg);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: monospace;
    font-size: .82rem;
    color: var(--accent2);
  }
  td.muted { color: var(--muted); font-size: .83rem; }

  /* ── 타이틀 슬라이드 전용 ── */
  .hero-icon { font-size: 5rem; margin-bottom: 20px; }
  .hero-title { font-size: 3.2rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 12px; }
  .hero-desc  { font-size: 1rem; color: var(--muted); line-height: 1.7; text-align: center; max-width: 560px; }
  .hero-chips { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }

  /* ── 키보드 힌트 ── */
  #kb-hint {
    position: fixed;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    font-size: .72rem;
    color: #484f58;
    z-index: 100;
  }

  /* ── 트리 구조 ── */
  .tree {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 28px;
    font-family: 'Cascadia Code', 'D2Coding', 'Fira Code', monospace;
    font-size: .84rem;
    line-height: 2;
    max-width: 680px;
    width: 100%;
  }

  /* ── 셀프 체크 목록 ── */
  .check-list {
    max-width: 820px;
    width: 100%;
  }
  .check-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 20px;
    margin-bottom: 10px;
    font-size: .9rem;
    line-height: 1.7;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .check-num {
    min-width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--border);
    color: var(--accent2);
    font-size: .8rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }
</style>
</head>
<body>

<div id="progress-bar"></div>
<div id="deck"></div>

<button class="nav-btn" id="btn-prev" onclick="go(-1)">‹</button>
<button class="nav-btn" id="btn-next" onclick="go(1)">›</button>
<div id="counter"></div>
<div id="kb-hint">← → 키보드로 이동</div>

<script>
const slides = [

/* ══════════════════════════════════════════════
   슬라이드 01 — 타이틀
══════════════════════════════════════════════ */
`<div class="hero-icon">🛍️</div>
<div class="hero-title">프론트엔드 마이페이지 리디자인</div>
<div class="hero-desc">MyPage.jsx 전면 재설계를 통해 배우는<br>Context API · Disclosure · Flexbox · UX 설계</div>
<div class="hero-chips">
  <span class="badge badge-blue">FRONTEND</span>
  <span class="badge badge-purple">REACT</span>
  <span class="badge badge-green">Context API</span>
  <span class="badge badge-red">KDT 교육과정</span>
</div>`,

/* ══════════════════════════════════════════════
   슬라이드 02 — 전체 흐름도
══════════════════════════════════════════════ */
`<div class="tag">01 · 흐름도</div>
<div class="slide-title">전체 흐름도</div>
<div class="slide-subtitle">/mypage 접속 시 컴포넌트가 동작하는 전체 과정</div>
<div class="tree">
<span class="c-blue">사용자가 /mypage 접속</span>
   ↓
<span class="c-yellow">PrivateRoute</span> → 로그인 안 됐으면 /login으로 이동
   ↓
<span class="c-green">MyPage 컴포넌트</span> 렌더링
   ├── <span class="c-muted">[사이드바]</span> 이니셜 아바타 + 이름/이메일 + 탭 내비
   │
   ├── <span class="c-purple">[주문 내역 탭 — 기본]</span>
   │     getOrders() → GET /api/orders
   │     상태별 카운트 + 주문 목록 렌더링
   │
   ├── <span class="c-blue">[계정 설정 탭]</span>
   │     행 클릭 → 폼 펼침(disclosure)
   │     updateMe() → PUT /api/members/me → Context 갱신
   │
   └── <span class="c-red">[회원 탈퇴]</span>
         사이드바 최하단 링크 → DeleteModal
         deleteMe() → logout() → navigate('/')
</div>`,

/* ══════════════════════════════════════════════
   슬라이드 03 — Context API
══════════════════════════════════════════════ */
`<div class="tag">02 · 핵심 개념</div>
<div class="slide-title">Context API — 전역 상태 관리</div>
<div class="slide-subtitle">"공용 창고" — 여러 컴포넌트가 props 없이 데이터를 공유하는 방법</div>
<div class="card-grid cols-3" style="max-width:820px;margin-bottom:20px">
  <div class="card" style="border-color:var(--accent2)">
    <h3><span class="c-blue">1단계</span> createContext</h3>
    <p>창고(Context) 자체를 만든다.<br>어떤 데이터를 공유할지 정의.</p>
  </div>
  <div class="card" style="border-color:var(--accent3)">
    <h3><span class="c-green">2단계</span> Provider</h3>
    <p>창고를 열어서 하위 컴포넌트에게 제공. <code style="color:var(--accent2)">&lt;Provider value={...}&gt;</code>로 감싼다.</p>
  </div>
  <div class="card" style="border-color:var(--accent4)">
    <h3><span class="c-purple">3단계</span> useContext</h3>
    <p>필요한 컴포넌트에서 창고를 꺼내 쓴다. props 없이 직접 접근 가능.</p>
  </div>
</div>
<pre style="max-width:780px">
<span class="c-muted">// AuthContext에서 user 정보와 갱신 함수를 꺼내 쓰는 패턴</span>
<span class="c-blue">const</span> { user, login: setUser, logout } = <span class="c-green">useAuth</span>()

<span class="c-muted">// 이름 변경 성공 후 Context 업데이트</span>
<span class="c-muted">// → Navbar의 이름도 자동으로 바뀜 (구독 중인 모든 컴포넌트 리렌더링)</span>
<span class="c-blue">const</span> res = <span class="c-yellow">await</span> <span class="c-green">updateMe</span>({ name: <span class="c-red">'새이름'</span> })
<span class="c-green">setUser</span>(res.data)  <span class="c-muted">// ← 이 한 줄이 핵심!</span>
</pre>`,

/* ══════════════════════════════════════════════
   슬라이드 04 — Context vs Props 차이
══════════════════════════════════════════════ */
`<div class="tag">03 · 핵심 개념</div>
<div class="slide-title">Context vs Props 차이</div>
<div class="slide-subtitle">Props drilling 문제를 Context가 어떻게 해결하는가</div>
<div class="card-grid cols-2" style="max-width:860px;margin-bottom:20px">
  <div class="card" style="border-color:var(--accent)">
    <h3>😓 Props Drilling (문제)</h3>
    <p style="margin-bottom:10px">데이터를 쓰지 않는 중간 컴포넌트도 무조건 전달해야 함</p>
    <pre style="background:transparent;border:none;padding:0;font-size:.8rem">
App
 └─ Layout <span class="c-muted">← user props 받음(안 씀)</span>
     └─ Sidebar <span class="c-muted">← user props 받음(안 씀)</span>
         └─ Avatar <span class="c-muted">← user 실제로 씀</span>
    </pre>
    <p style="margin-top:8px;color:var(--accent);font-size:.83rem">중간 계층이 깊을수록 유지보수 지옥</p>
  </div>
  <div class="card" style="border-color:var(--accent3)">
    <h3>✅ Context (해결)</h3>
    <p style="margin-bottom:10px">필요한 컴포넌트가 창고에서 직접 꺼낸다. 중간 계층 불필요.</p>
    <pre style="background:transparent;border:none;padding:0;font-size:.8rem">
<span class="c-green">&lt;AuthProvider&gt;</span>   <span class="c-muted">← 창고 오픈</span>
 └─ Layout
     └─ Sidebar
         └─ Avatar  <span class="c-green">useAuth()</span> <span class="c-muted">← 직접 접근</span>
<span class="c-green">&lt;/AuthProvider&gt;</span>
    </pre>
    <p style="margin-top:8px;color:var(--accent3);font-size:.83rem">중간 컴포넌트는 user를 몰라도 됨</p>
  </div>
</div>
<div class="card" style="max-width:860px;border-color:var(--accent4)">
  <p style="font-size:.88rem">💡 이 프로젝트에서는 <code style="color:var(--accent4)">AuthContext</code>(로그인 상태)와 <code style="color:var(--accent4)">CartContext</code>(장바구니) 두 곳에 적용되어 있다.</p>
</div>`,

/* ══════════════════════════════════════════════
   슬라이드 05 — Disclosure 패턴
══════════════════════════════════════════════ */
`<div class="tag">04 · 핵심 개념</div>
<div class="slide-title">Disclosure 패턴</div>
<div class="slide-subtitle">"클릭 전엔 숨김, 클릭 후 펼침" — 인지 부하를 줄이는 UI 기법</div>
<div class="card-grid cols-2" style="max-width:860px;margin-bottom:20px">
  <div class="card" style="border-color:var(--accent2)">
    <h3>💡 핵심 아이디어</h3>
    <ul>
      <li>HTML <code>&lt;details&gt;/&lt;summary&gt;</code>와 같은 개념</li>
      <li><code style="color:var(--accent2)">useState</code>로 열림/닫힘 상태 관리</li>
      <li>한 번에 하나의 섹션만 열리도록 설계</li>
      <li>폼이 항상 펼쳐져 있으면 인지 부하 증가</li>
    </ul>
  </div>
  <div class="card" style="border-color:var(--accent3)">
    <h3>🔑 toggle 함수의 핵심</h3>
    <p style="margin-bottom:8px">현재 열린 섹션을 다시 클릭하면 <code style="color:var(--accent3)">null</code>로 닫는다.</p>
    <p style="font-size:.83rem;color:var(--accent3)">prev === section ? null : section</p>
    <p style="margin-top:8px;font-size:.83rem">이 분기가 빠지면 두 섹션이 동시에 열리는 버그 발생!</p>
  </div>
</div>
<pre style="max-width:780px">
<span class="c-muted">// 한 번에 하나만 열리게 — 'name' | 'password' | null</span>
<span class="c-blue">const</span> [openSection, setOpenSection] = <span class="c-green">useState</span>(<span class="c-purple">null</span>)

<span class="c-blue">const</span> toggle = (section) =>
  <span class="c-green">setOpenSection</span>((prev) => (prev === section ? <span class="c-purple">null</span> : section))

<span class="c-muted">// 폼은 열렸을 때만 렌더링 (조건부 렌더링)</span>
{openSection === <span class="c-red">'name'</span> && <span class="c-green">&lt;NameForm /&gt;</span>}
</pre>`,

/* ══════════════════════════════════════════════
   슬라이드 06 — CSS Flexbox 2컬럼 레이아웃
══════════════════════════════════════════════ */
`<div class="tag">05 · 핵심 개념</div>
<div class="slide-title">CSS Flexbox 2컬럼 레이아웃</div>
<div class="slide-subtitle">사이드바(고정) + 콘텐츠(가변) — 이커머스 마이페이지의 표준 구조</div>
<div class="card-grid cols-2" style="max-width:860px;margin-bottom:20px">
  <div class="card" style="border-color:var(--accent2)">
    <h3><span class="c-blue">flex-shrink: 0</span> — 사이드바 고정</h3>
    <p>화면이 좁아져도 사이드바 너비(220px)를 절대 줄이지 않는다.<br>"절대 줄지 마"라는 명령.</p>
  </div>
  <div class="card" style="border-color:var(--accent3)">
    <h3><span class="c-green">flex: 1</span> — 콘텐츠 가변</h3>
    <p>남은 공간을 전부 차지한다.<br>사이드바가 220px를 가져간 뒤,<br>나머지를 모두 콘텐츠가 가진다.</p>
  </div>
</div>
<pre style="max-width:780px">
<span class="c-muted">/* index.css */</span>
.<span class="c-green">mypage-layout</span> { display: <span class="c-blue">flex</span>; }

.<span class="c-green">mypage-sidebar</span> {
  width: <span class="c-yellow">220px</span>;
  flex-shrink: <span class="c-purple">0</span>;  <span class="c-muted">/* 절대 줄지 마 → 사이드바 고정 */</span>
}

<span class="c-muted">/* 콘텐츠 영역: style={{ flex: 1 }} 인라인으로 */</span>

<span class="c-muted">/* 모바일: 세로로 전환 */</span>
<span class="c-yellow">@media</span> (max-width: <span class="c-red">768px</span>) {
  .<span class="c-green">mypage-layout</span> { flex-direction: <span class="c-blue">column</span>; }
}
</pre>`,

/* ══════════════════════════════════════════════

/* ── 렌더링 엔진 ── */
let cur = 0;
const deck   = document.getElementById('deck');
const bar    = document.getElementById('progress-bar');
const counter= document.getElementById('counter');

function render() {
  const total = slides.length;
  bar.style.width = ((cur + 1) / total * 100) + '%';
  counter.textContent = `${cur + 1} / ${total}`;
  document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
  let el = document.getElementById('slide-' + cur);
  if (!el) {
    el = document.createElement('div');
    el.className = 'slide';
    el.id = 'slide-' + cur;
    el.innerHTML = slides[cur];
    deck.appendChild(el);
  }
  requestAnimationFrame(() => el.classList.add('active'));
}

function go(dir) {
  const next = cur + dir;
  if (next < 0 || next >= slides.length) return;
  const old = document.getElementById('slide-' + cur);
  if (old) {
    old.classList.remove('active');
    if (dir > 0) old.classList.add('exit');
    setTimeout(() => old && old.remove(), 450);
  }
  cur = next;
  render();
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') go(1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   go(-1);
});

render();
</script>
