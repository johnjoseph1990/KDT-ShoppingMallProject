spring.application.name=shoppingmall

# ── 프로파일 ──────────────────────────────────────────────────────────────────
# 기본값 dev: 로컬/Docker 개발 환경에서 DevDataInitializer(시드 데이터)가 동작한다.
# 운영 배포 시 환경변수 SPRING_PROFILES_ACTIVE=prod 로 오버라이드하면 시드 비활성화.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── PostgreSQL 연결 ──────────────────────────────────────────────────────────
# 로컬 실행: docker compose up -d 후 아래 기본값으로 연결됨
# 운영 배포 시 환경변수로 오버라이드:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://prod-host:5432/shoppingmall
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/shoppingmall}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mins}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mins1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
# update: 엔티티 변경 시 스키마 자동 ALTER (컬럼 추가 O, 삭제/rename X)
# 운영 전환 시 validate + Flyway 마이그레이션으로 교체할 것
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── 토스페이먼츠 결제창 연동 ──────────────────────────────────────────────────
# 시크릿 키는 https://developers.tosspayments.com 개발자센터에서 발급받은 값을
# TOSS_SECRET_KEY 환경변수로 주입할 것 (절대 커밋 금지). 미설정 시에도 부팅은 되지만
# 결제 승인(confirm) 호출 시 토스 서버가 401을 반환한다.
toss.payments.secret-key=${TOSS_SECRET_KEY:}

# ── Actuator (헬스체크) ──────────────────────────────────────────────────────
# 기본값도 health만 노출하지만, 다음 단계(metrics/prometheus 추가)에서 값을 늘릴 걸
# 명시적으로 남겨둔다.
management.endpoints.web.exposure.include=health

# ── 로그에 traceId 삽입 (TraceIdFilter가 MDC에 넣은 값을 로그 레벨 옆에 표시) ─────
# %X{traceId:-}의 ":-"는 MDC 값이 없을 때(부팅 직후 로그 등) 빈 문자열로 대체한다.
logging.pattern.level=%5p [%X{traceId:-}]
