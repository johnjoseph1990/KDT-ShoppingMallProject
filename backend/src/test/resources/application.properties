# ── 테스트 전용 설정 (main/application.properties를 덮어씀) ──────────────────
# @DataJpaTest 는 이 설정 + H2 embedded DB로 동작
# @WebMvcTest, @ExtendWith(MockitoExtension) 는 DB 연결 자체를 안 함

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 테스트마다 깨끗한 스키마로 시작, 테스트 종료 시 삭제
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# 전체 컨텍스트를 띄우는 ShoppingmallApplicationTests(contextLoads)에서 TossPaymentsProperties
# 빈이 만들어지려면 이 키가 있어야 한다. 실제 토스 API를 호출하는 테스트가 아니므로 더미 값으로 충분.
toss.payments.secret-key=test_sk_dummy
