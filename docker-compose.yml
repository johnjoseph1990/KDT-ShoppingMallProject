services:
  db:
    image: postgres:16
    container_name: mins-db
    environment:
      POSTGRES_DB: shoppingmall
      POSTGRES_USER: mins
      POSTGRES_PASSWORD: mins1234
    ports:
      # 호스트 5433 → 컨테이너 5432 (다른 프로젝트가 5432를 사용 중)
      - "5433:5432"
    volumes:
      # 컨테이너를 내려도 데이터가 유지됨 (docker compose down -v 로 초기화)
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mins -d shoppingmall"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: mins-backend
    # profiles: 지정한 프로필이 활성화됐을 때만 기동되는 "선택적 서비스"로 표시한다.
    # 덕분에 그냥 `docker compose up -d` 를 쳐도 db만 뜬다.
    # 왜 필요한가: 예전에는 이 명령이 backend 컨테이너까지 띄워 8080을 선점했고,
    #   그러면 scripts/dev-up.ps1이 "백엔드 이미 실행 중"으로 판단해 소스 실행(bootRun)을
    #   건너뛰었다. 결과적으로 낡은 이미지가 최신 코드인 척 화면에 떴다. (2026-08-07 수정)
    # 배포와 동일한 컨테이너 형상을 확인하려면:
    #   docker compose --profile full up -d --build
    #   (--build 필수 — 없으면 예전에 빌드된 이미지를 그대로 재사용한다)
    profiles: ["full"]
    ports:
      - "8080:8080"
    environment:
      # 컨테이너 내부 통신은 서비스명 'db'로 해소, 포트는 컨테이너 내부 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/shoppingmall
      SPRING_DATASOURCE_USERNAME: mins
      # 운영 배포 시 .env 파일 또는 호스트 환경변수로 오버라이드
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-mins1234}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME:-product-images}
      # 운영 배포 시 DDL_AUTO=validate 로 설정해 자동 스키마 변경 방지
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-update}
      # 운영 배포 시 SPRING_PROFILES_ACTIVE=prod 로 설정 → DevDataInitializer 비활성화
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    healthcheck:
      # Alpine 기반 이미지라 curl이 없고 BusyBox wget은 기본 포함되어 있어 이걸 사용한다.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      # JVM 부팅(클래스패스 스캔, Hibernate DDL 등)은 DB 기동보다 오래 걸리므로 유예 시간을 둔다.
      start_period: 30s
    depends_on:
      db:
        # DB 헬스체크 통과 후 백엔드가 기동되도록 순서 보장
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Vite는 빌드 시점에 환경변수를 번들에 박으므로, 런타임 environment가 아닌 build args로 전달해야 한다.
        # 호스트에서 VITE_TOSS_CLIENT_KEY 환경변수 또는 .env 파일로 값을 설정할 것.
        VITE_TOSS_CLIENT_KEY: ${VITE_TOSS_CLIENT_KEY:-}
    container_name: mins-frontend
    # backend와 같은 "full" 프로필. 이 컨테이너는 :80으로 뜨고, 개발용 Vite는 :5173이라
    # 포트가 겹치지는 않지만, 낡은 빌드가 :80에 남아 있으면 그것대로 혼란을 준다.
    profiles: ["full"]
    ports:
      - "80:80"
    environment:
      # nginx.conf.template의 ${BACKEND_URL}을 컨테이너 기동 시 envsubst로 치환한다.
      # 로컬: docker-compose 서비스명 + 컨테이너 직접 포트 (네트워크 내부 직통)
      # Azure: http://backend.internal.<env-id>.koreacentral.azurecontainerapps.io (full FQDN 필요)
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        # 백엔드 프로세스가 뜨는 것만이 아니라, 실제로 요청을 받을 준비가 됐을 때 프론트를 기동한다.
        condition: service_healthy

volumes:
  postgres_data:
