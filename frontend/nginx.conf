server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        # React SPA: 새로고침 시 Nginx가 경로를 직접 찾다가 404를 내지 않도록
        # 파일·디렉터리가 없으면 index.html로 fallback해 React Router가 처리하게 한다.
        try_files $uri $uri/ /index.html;
    }

    # /api 요청은 백엔드 컨테이너로 프록시
    # 개발 환경의 Vite proxy(/api → localhost:8080) 역할을 Nginx가 대신한다.
    # 'backend'는 docker-compose 서비스명 — 같은 네트워크 안에서 DNS로 해소된다.
    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
