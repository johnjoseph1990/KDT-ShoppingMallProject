server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        # React SPA: 새로고침 시 Nginx가 경로를 직접 찾다가 404를 내지 않도록
        # 파일·디렉터리가 없으면 index.html로 fallback해 React Router가 처리하게 한다.
        try_files $uri $uri/ /index.html;
    }

    # /api 요청은 백엔드 컨테이너로 프록시
    # BACKEND_URL 환경변수로 주입 — 런타임에 envsubst로 치환된다.
    # 로컬 Docker Compose: http://backend:8080 (컨테이너 직접 통신)
    # Azure Container Apps: http://backend (내부 ingress, 포트 80)
    location /api {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
