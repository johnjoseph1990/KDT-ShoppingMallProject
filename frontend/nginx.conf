# ── 루트 도메인 → www 리다이렉트 ──────────────────────────────────────────────
# minsdev.works 와 www.minsdev.works 두 주소 모두 Azure에 바인딩되어 있어서,
# 아무 처리도 안 하면 "같은 사이트가 서로 다른 두 주소로 존재"하게 된다.
# 검색엔진은 이를 중복 콘텐츠로 보고 평가를 나눠 가지며, 세션 쿠키도 두 도메인에
# 따로 저장돼 "로그인했는데 풀린 것처럼 보이는" 현상이 생긴다. 그래서 하나를
# 정본(canonical)으로 정하고 나머지는 그쪽으로 넘긴다.
#
# server_name: nginx가 요청의 Host 헤더를 보고 어느 server 블록으로 보낼지 고르는 기준.
# 아래 블록은 Host가 정확히 "minsdev.works"일 때만 선택된다.
server {
    listen 80;
    server_name minsdev.works;

    # 301(영구 이동) — 검색엔진이 색인을 www로 옮기고, 브라우저도 다음부터는
    # 서버에 묻지 않고 바로 www로 간다.
    # https 하드코딩 — Azure가 앞단(Envoy)에서 TLS를 종료하고 컨테이너로는 평문
    # HTTP로 넘기므로, 여기서 $scheme을 쓰면 항상 "http"가 되어 HTTPS 접속자를
    # 평문으로 되돌려보내게 된다.
    # $request_uri — 쿼리스트링까지 포함한 원래 경로. 이게 없으면 /products/3으로
    # 들어온 사람이 홈으로 튕긴다.
    return 301 https://www.minsdev.works$request_uri;
}

# ── 메인 서빙 블록 ────────────────────────────────────────────────────────────
# default_server: Host 헤더가 위 블록과 안 맞는 모든 요청(www.minsdev.works,
# Azure 기본 FQDN, 헬스체크의 localhost 등)이 여기로 온다. server 블록이
# 하나뿐일 때는 자동으로 기본값이었지만, 위에 블록이 생겼으므로 명시해준다.
server {
    listen 80 default_server;

    # NGINX_RESOLVER: docker-entrypoint-wrapper.sh가 /etc/resolv.conf에서 읽어온 DNS 주소
    # Azure Container Apps의 Kubernetes CoreDNS 주소는 환경마다 다르므로 동적으로 주입
    # proxy_pass에 변수를 쓸 때만 resolver가 적용된다 — 매 요청마다 DNS 재조회
    resolver ${NGINX_RESOLVER} valid=30s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        # React SPA: 새로고침 시 Nginx가 경로를 직접 찾다가 404를 내지 않도록
        # 파일·디렉터리가 없으면 index.html로 fallback해 React Router가 처리하게 한다.
        try_files $uri $uri/ /index.html;
    }

    # Vite가 빌드하는 JS/CSS는 파일명에 콘텐츠 해시가 붙는다(예: index-DcWjj621.js).
    # 내용이 바뀌면 파일명도 바뀌므로 영구 캐시해도 안전하다 — immutable로 명시해
    # 브라우저가 재검증 요청조차 보내지 않게 한다.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html은 해시 없는 고정 파일명이라 위 규칙과 반대로 가야 한다.
    # 캐시 헤더가 없으면 브라우저가 자체 판단으로 캐시해, 재배포 후에도 옛 index.html이
    # 계속 서빙되어 새 JS 번들을 가리키는 참조 자체가 갱신되지 않는 문제가 있었다
    # (2026-08-02 DEF-10 — 결제 키를 배포했는데 실제로는 배포 전 번들이 계속 로드됨).
    # no-cache는 "저장은 하되 매번 서버에 재검증"을 의미해, 파일이 그대로면 304로
    # 응답 크기를 아끼면서도 새 배포는 즉시 반영된다.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # /api 요청은 백엔드 컨테이너로 프록시
    # BACKEND_URL 환경변수로 주입 — 런타임에 envsubst로 치환된다.
    # 로컬 Docker Compose: http://backend:8080 (컨테이너 직접 통신)
    # Azure Container Apps: http://backend.internal.xxx (내부 ingress FQDN)
    # 변수($backend)로 저장해야 resolver가 동작한다 — proxy_pass에 직접 쓰면 시작 시 DNS 캐시
    location /api {
        set $backend "${BACKEND_URL}";
        proxy_pass $backend;
        # $proxy_host: proxy_pass URL에서 추출한 호스트명 사용
        # Azure Container Apps internal ingress는 Host 헤더로 라우팅하므로
        # 클라이언트의 Host($host=frontend.xxx)가 아닌 백엔드 FQDN을 전달해야 함
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
