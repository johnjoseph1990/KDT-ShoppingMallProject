name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  backend:
    name: Backend Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      # check = spotlessCheck(포맷 강제) + test(테스트 실행, 리포트 생성) 포함
      # jacocoTestCoverageVerification = 커버리지 60% 미달 시 빌드 실패(하드 게이트)
      # jacocoTestReport = 아래 아티팩트 업로드용 HTML 리포트 보장
      - name: Check, test & coverage gate
        working-directory: backend
        run: ./gradlew check jacocoTestCoverageVerification jacocoTestReport

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/test/html/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: backend/build/reports/tests/test/

  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # prettier 포맷 검사(--check) — 규칙 위반 시 실패시켜 포맷 강제
      - name: Format check
        working-directory: frontend
        run: npm run format:check

      # vitest 단발 실행(watch 아님) — 프론트 테스트를 CI 통과 조건에 포함
      - name: Test
        working-directory: frontend
        run: npm run test:run

      - name: Build
        working-directory: frontend
        run: npm run build

  # ── CD: Azure Container Apps 배포 ────────────────────────────────────────────
  # master push 시에만 실행 (PR은 CI만, 배포는 하지 않음)
  # 사전 조건: backend/frontend 테스트가 모두 통과해야 deploy가 실행됨
  deploy:
    name: Deploy to Azure
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v7

      # Azure CLI 인증 — GitHub Secret AZURE_CREDENTIALS(Service Principal JSON)로 로그인
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ACR(Azure Container Registry)에 Docker 이미지를 푸시하기 위한 로그인
      - name: Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            ${{ secrets.ACR_LOGIN_SERVER }} \
            --username "${{ secrets.ACR_USERNAME }}" \
            --password-stdin

      # 백엔드 이미지 빌드 + ACR 푸시 (git SHA를 태그로 사용해 롤백 가능하게 유지)
      - name: Build & Push Backend Image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/backend:${{ github.sha }} ./backend
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/backend:${{ github.sha }}

      # 프론트엔드 이미지 빌드 + ACR 푸시
      # VITE_TOSS_CLIENT_KEY는 Vite 빌드 시점에 번들에 박히므로 build-arg로 전달
      - name: Build & Push Frontend Image
        run: |
          docker build \
            --build-arg VITE_TOSS_CLIENT_KEY=${{ secrets.VITE_TOSS_CLIENT_KEY }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }} \
            ./frontend
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}

      # 백엔드 Container App에 새 이미지 배포
      - name: Deploy Backend
        run: |
          az containerapp update \
            --name backend \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/backend:${{ github.sha }}

      # 프론트엔드 Container App에 새 이미지 배포
      - name: Deploy Frontend
        run: |
          az containerapp update \
            --name frontend \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}
