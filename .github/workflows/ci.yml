name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  backend:
    name: Backend Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      # check = spotlessCheck(포맷 강제) + test(테스트 실행, 리포트 생성) 포함
      # jacocoTestCoverageVerification = 커버리지 60% 미달 시 빌드 실패(하드 게이트)
      # jacocoTestReport = 아래 아티팩트 업로드용 HTML 리포트 보장
      - name: Check, test & coverage gate
        working-directory: backend
        run: ./gradlew check jacocoTestCoverageVerification jacocoTestReport

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/test/html/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: backend/build/reports/tests/test/

  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # prettier 포맷 검사(--check) — 규칙 위반 시 실패시켜 포맷 강제
      - name: Format check
        working-directory: frontend
        run: npm run format:check

      # vitest 단발 실행(watch 아님) — 프론트 테스트를 CI 통과 조건에 포함
      - name: Test
        working-directory: frontend
        run: npm run test:run

      - name: Build
        working-directory: frontend
        run: npm run build
