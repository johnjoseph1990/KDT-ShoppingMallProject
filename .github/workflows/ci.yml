name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # workflow_dispatch: Actions 탭의 "Run workflow" 버튼 / `gh workflow run CI`로
  # 수동 실행할 수 있게 하는 트리거. 위 세 항목은 OR 조건이라 기존 동작은 그대로다.
  #
  # 왜 넣는가: 2026-08-07 GitHub Actions 장애(major outage) 때 push 이벤트가
  # 아예 처리되지 않아 CI 실행이 0건 생성됐다. 장애가 복구돼도 지나간 push는
  # 소급 실행되지 않는데, 이 트리거가 없으면 재실행할 방법이 빈 커밋뿐이었다.
  # (이미 만들어진 실행이 없으므로 `gh run rerun`도 쓸 수 없다)
  workflow_dispatch:

jobs:
  backend:
    name: Backend Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      # check = spotlessCheck(포맷 강제) + test(테스트 실행, 리포트 생성) 포함
      # jacocoTestCoverageVerification = 커버리지 60% 미달 시 빌드 실패(하드 게이트)
      # jacocoTestReport = 아래 아티팩트 업로드용 HTML 리포트 보장
      - name: Check, test & coverage gate
        working-directory: backend
        run: ./gradlew check jacocoTestCoverageVerification jacocoTestReport

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/test/html/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/build/reports/tests/test/

  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # prettier 포맷 검사(--check) — 규칙 위반 시 실패시켜 포맷 강제
      - name: Format check
        working-directory: frontend
        run: npm run format:check

      # vitest 단발 실행(watch 아님) — 프론트 테스트를 CI 통과 조건에 포함
      - name: Test
        working-directory: frontend
        run: npm run test:run

      - name: Build
        working-directory: frontend
        run: npm run build

  # ── E2E: 전체 스택(DB+백엔드+프론트)을 러너에 올려 핵심 사용자 경로를 브라우저로 검증 ──
  # 단위 테스트(backend/frontend job)가 못 잡는 통합·화면·인가 결함을 배포 전에 차단한다.
  # (과거 DEF 16건 중 8건이 '배포 후 재검증'에서야 발견됐던 지점을 겨냥)
  e2e:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    # 가벼운 단위 게이트를 먼저 통과한 뒤에만 이 무거운 잡을 돌려 낭비를 줄인다.
    needs: [backend, frontend]
    services:
      # PostgreSQL을 서비스 컨테이너로 띄운다 (docker-compose.yml과 동일한 이미지·계정).
      # 러너 호스트의 localhost:5432 로 노출된다.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shoppingmall
          POSTGRES_USER: mins
          POSTGRES_PASSWORD: mins1234
        ports:
          - 5432:5432
        # 백엔드가 붙기 전에 DB가 요청을 받을 준비가 되도록 헬스체크로 대기시킨다.
        options: >-
          --health-cmd "pg_isready -U mins -d shoppingmall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Playwright가 조종할 실제 브라우저(Chromium)와 OS 의존 라이브러리를 설치한다.
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # 백엔드를 백그라운드로 기동한다. dev 프로파일이라 DevDataInitializer가 상품·데모 계정을
      # 시드해 E2E가 쓸 데이터가 생긴다. DB는 위 서비스 컨테이너(localhost:5432)를 가리킨다.
      # nohup + & : 이 스텝이 끝나도 러너 VM에서 백엔드 프로세스가 계속 살아있게 한다.
      - name: Start backend
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/shoppingmall
          SPRING_DATASOURCE_USERNAME: mins
          SPRING_DATASOURCE_PASSWORD: mins1234
        run: |
          chmod +x gradlew
          nohup ./gradlew bootRun --no-daemon > backend.log 2>&1 &
          echo "백엔드 기동 시작 (백그라운드)"

      # /actuator/health 가 UP 을 반환할 때까지 최대 ~3분 폴링한다.
      # 안 뜨면 백엔드 로그를 출력하고 잡을 실패시킨다.
      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "백엔드 준비 완료"
              exit 0
            fi
            sleep 3
          done
          echo "::error::백엔드가 제 시간에 기동하지 못했습니다. 아래 로그를 참고하세요."
          tail -n 120 backend/backend.log || true
          exit 1

      # Playwright 실행. webServer 설정이 vite dev(5173)를 자동 기동하고,
      # dev 서버가 /api 를 8080 백엔드로 프록시하므로 세션 쿠키 인증이 그대로 동작한다.
      - name: Run E2E smoke
        working-directory: frontend
        run: npm run e2e

      # 실패해도(always) 리포트를 아티팩트로 올려 원인 분석에 쓴다.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-backend-log
          path: backend/backend.log
          retention-days: 7

  # ── CD: Azure Container Apps 배포 ────────────────────────────────────────────
  # master push 시에만 실행 (PR은 CI만, 배포는 하지 않음)
  # 사전 조건: backend/frontend 단위 테스트 + e2e 스모크가 모두 통과해야 deploy가 실행됨
  deploy:
    name: Deploy to Azure
    # E2E 스모크까지 통과해야 배포한다 — '배포 후 발견'을 '배포 전 차단'으로 옮기는 게 목적.
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    # [2026-09-24 배포 중단] Azure 비용 절감을 위해 리소스 그룹(mins-shopping-rg)을 삭제한다.
    # 배포 대상이 없어졌으므로 `false &&`로 job을 끈다 — 켜 두면 master push마다
    # az containerapp update가 "리소스 없음"으로 실패해 CI가 계속 빨갛게 된다.
    # 재배포 시: 인프라를 다시 만든 뒤 앞의 `false &&`만 지우면 원래 조건으로 돌아간다.
    # (job 단위 if가 false면 이 job은 "skipped"로 표시되고, 테스트 job들은 그대로 돈다)
    if: false && github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      # 배포 전 시크릿 검증 — 도커 빌드에 시간을 쓰기 전에 맨 앞에서 빠르게 실패시킨다.
      #
      # 왜 필요한가: GitHub Actions에서 `${{ secrets.NOT_EXIST }}`는 에러가 아니라
      # "빈 문자열"로 치환된다. 그래서 시크릿을 등록하지 않아도 빌드·배포가 성공하고,
      # 기능만 조용히 죽는다. 실제로 2026-08-02에 VITE_TOSS_CLIENT_KEY가 없는 채로
      # 배포되어 운영 환경 결제가 전부 불가능했다(document/2026-08-02_배포검증_체크리스트.md DEF-1).
      #
      # `::error::` 는 GitHub Actions 로그에 빨간 에러로 표시되게 하는 워크플로우 명령어다.
      - name: Verify deploy secrets
        env:
          # 시크릿을 env로 받아둔다. 셸에 직접 보간하면 값에 따옴표 등이 섞였을 때
          # 명령이 깨질 수 있어서, 이렇게 환경변수를 거치는 게 안전한 관용구다.
          VITE_TOSS_CLIENT_KEY: ${{ secrets.VITE_TOSS_CLIENT_KEY }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          # missing: 비어 있는 시크릿 개수를 세는 카운터.
          # 첫 실패에서 바로 exit 하지 않는 이유 — 두 개가 비어 있으면 하나 고치고
          # 다시 배포를 돌려야 나머지를 알게 된다. 전부 검사한 뒤 한 번에 보고한다.
          missing=0

          # 검사할 시크릿 "이름들"을 순회한다. 값이 아니라 이름을 도는 게 핵심.
          for name in VITE_TOSS_CLIENT_KEY TOSS_SECRET_KEY ACR_LOGIN_SERVER; do
            # ${!name} = 간접 참조(indirect expansion).
            # name이 "TOSS_SECRET_KEY"라는 문자열일 때 ${!name}은 그 이름을 가진
            # 변수의 "값"을 꺼낸다. 덕분에 if를 세 번 복붙하지 않아도 된다.
            # -z 는 "문자열 길이가 0인가". 큰따옴표는 필수 — 없으면 값이 비었을 때
            # 셸이 [ -z ] 로 해석해 문법 오류가 난다.
            if [ -z "${!name}" ]; then
              # ::error:: 는 GitHub Actions 워크플로우 명령어. 로그에 빨간 에러로 뜨고
              # 요약 화면에도 노출된다. 값은 절대 찍지 않고 "이름"만 알린다.
              echo "::error::$name 이(가) 비어 있습니다. GitHub Secrets에 등록한 뒤 다시 배포하세요."
              missing=$((missing + 1))
            fi
          done

          if [ "$missing" -gt 0 ]; then
            echo "::error::시크릿 $missing 개가 누락되어 배포를 중단합니다."
            # exit 1 = 스텝 실패 → deploy job 중단. 도커 빌드 전에 멈추므로 시간 낭비가 없다.
            exit 1
          fi

          echo "필수 배포 시크릿 확인 완료."

      # Azure CLI 인증 — GitHub Secret AZURE_CREDENTIALS(Service Principal JSON)로 로그인
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ACR(Azure Container Registry)에 Docker 이미지를 푸시하기 위한 로그인
      - name: Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            ${{ secrets.ACR_LOGIN_SERVER }} \
            --username "${{ secrets.ACR_USERNAME }}" \
            --password-stdin

      # 백엔드 이미지 빌드 + ACR 푸시 (git SHA를 태그로 사용해 롤백 가능하게 유지)
      - name: Build & Push Backend Image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/backend:${{ github.sha }} ./backend
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/backend:${{ github.sha }}

      # 프론트엔드 이미지 빌드 + ACR 푸시
      # VITE_TOSS_CLIENT_KEY는 Vite 빌드 시점에 번들에 박히므로 build-arg로 전달
      - name: Build & Push Frontend Image
        run: |
          docker build \
            --build-arg VITE_TOSS_CLIENT_KEY=${{ secrets.VITE_TOSS_CLIENT_KEY }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }} \
            ./frontend
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}

      # 백엔드 Container App에 새 이미지 배포
      - name: Deploy Backend
        run: |
          az containerapp update \
            --name backend \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/backend:${{ github.sha }}

      # 백엔드 internal FQDN 조회 — 프론트엔드 nginx가 같은 환경 내 백엔드를 찾을 때 사용
      # internal ingress는 HTTP를 허용(allowInsecure=true)해야 nginx가 301 없이 직접 접속 가능
      - name: Get Backend Internal FQDN
        id: backend_fqdn
        run: |
          FQDN=$(az containerapp show \
            --name backend \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          echo "backend_url=http://${FQDN}" >> $GITHUB_OUTPUT
          # HTTP를 허용하지 않으면 301로 redirect되므로 allowInsecure 보장
          az containerapp ingress update \
            --name backend \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --allow-insecure

      # 프론트엔드 Container App에 새 이미지 + BACKEND_URL 환경변수 함께 배포
      - name: Deploy Frontend
        run: |
          az containerapp update \
            --name frontend \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }} \
            --set-env-vars "BACKEND_URL=${{ steps.backend_fqdn.outputs.backend_url }}"
